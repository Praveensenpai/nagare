name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "nagare-release-${{ matrix.target }}"
          save-if: true

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release archive (.tar.gz)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/nagare staging/
          cd staging
          tar -czf ../nagare-${{ matrix.target }}.tar.gz nagare
          cd ..

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: nagare-${{ matrix.target }}.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 🌊 nagare ${{ github.ref_name }}
          body: |
            🌊 **nagare ${{ github.ref_name }}** ✨
            Autonomous weekly anime RSS scheduler with Seedr.cc cloud delivery, Jellyfin library placement, and an aesthetic Ratatui interactive dashboard.

            ### 🌟 Key Highlights
            - 🖥️ **Interactive Terminal Dashboard**: Real-time TUI for tracking shows, browsing live SubsPlease releases, and monitoring Seedr storage.
            - ⚡ **Zero-Cloud-Bloat Caching**: Checks free quota, caches, downloads, and immediately purges cloud storage.
            - 📺 **Jellyfin Auto-Organization**: Renames and files media cleanly (`Show/Season 01/Show - S01E05 - 1080p.mkv`).
            - 📱 **Telegram Event Alerts**: Integrated with `tayori` for instant mobile notifications.
            - 🔄 **Conditional HTTP Fetching**: Native ETag / Last-Modified support.

            ### 📦 Release Assets
            - **Linux (x86_64)**: `nagare-x86_64-unknown-linux-gnu.tar.gz`
          generate_release_notes: true
          draft: false
          prerelease: false
          files: artifacts/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
